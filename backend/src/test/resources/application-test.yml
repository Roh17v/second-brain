# Tests use in-memory H2 so they don't need your local Postgres.
spring:
  datasource:
    url: jdbc:h2:mem:secondbrain;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-only-jwt-secret-key-min-32-chars-long!!
    expiration-ms: 3600000
  embedding:
    provider: hashing
    model: hashing-test
    dimensions: 32
  llm:
    provider: echo
    model: echo-llm
  storage:
    base-path: ${java.io.tmpdir}/secondbrain-test-storage

