# Shared config for all profiles. No secrets in this file.
# Values that change between environments come from environment variables.
spring:
  application:
    name: second-brain
  profiles:
    default: dev

  datasource:
    # Single connection string (URL can include user + password).
    # Example:
    #   jdbc:postgresql://localhost:5432/secondbrain?user=postgres&password=your_password
    #
    # Do NOT use Node-style URLs (postgresql://user:pass@host/db) — JDBC needs the form above.
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}

# JWT — secret must come from environment (min ~32 chars for HS256)
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    base-path: ${FILE_STORAGE_PATH:./storage}
  # --- Pluggable AI (swap provider via env; no chat/search code changes) ---
  # See com.secondbrain.ai package-info and AiProviders.
  embedding:
    # ollama | gemini | hashing (tests only)
    provider: ${EMBEDDING_PROVIDER:ollama}
    base-url: ${EMBEDDING_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
    model: ${EMBEDDING_MODEL:nomic-embed-text}
    # Must match model (+ re-embed all docs when this or provider changes)
    dimensions: ${EMBEDDING_DIMENSIONS:768}
    # Cloud keys (gemini). Prefer env; never commit.
    api-key: ${EMBEDDING_API_KEY:${GEMINI_API_KEY:}}
    # Matryoshka truncate (Gemini). 0 = provider default. Often 768/1536/3072.
    output-dimensionality: ${EMBEDDING_OUTPUT_DIMENSIONALITY:0}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:60}
  llm:
    # ollama | gemini | groq | echo (tests only)
    provider: ${LLM_PROVIDER:ollama}
    base-url: ${LLM_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434}}
    model: ${LLM_MODEL:qwen3:4b}
    temperature: ${LLM_TEMPERATURE:0.2}
    # Groq Qwen: none | default (none = no CoT in the stream)
    reasoning-effort: ${LLM_REASONING_EFFORT:none}
    # Groq: GROQ_API_KEY; Gemini: GEMINI_API_KEY; or LLM_API_KEY for either
    api-key: ${LLM_API_KEY:${GROQ_API_KEY:${GEMINI_API_KEY:}}}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
  ocr:
    # none | mistral
    provider: ${OCR_PROVIDER:none}
    api-key: ${MISTRAL_API_KEY:}
    base-url: ${MISTRAL_BASE_URL:https://api.mistral.ai}
    model: ${OCR_MODEL:mistral-ocr-latest}
    min-text-chars: ${OCR_MIN_TEXT_CHARS:40}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:180}
  cors:
    # Comma-separated browser origins allowed to call the API
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
